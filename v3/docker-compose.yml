services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chloeai
      MYSQL_USER: chloe
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_root_me
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - chloe_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange_root_me"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - chloe_qdrant:/qdrant/storage
volumes:
  chloe_mysql:
  chloe_qdrant:
